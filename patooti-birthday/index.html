<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Happy Birthday, Patooti!</title>
  <meta name="description" content="A tiny 8-bit birthday adventure.">
  <meta name="theme-color" content="#ffd3e2">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 7 6' shape-rendering='crispEdges'%3E%3Cpath fill='%23f7a8c4' d='M1 0h2v1h1V0h2v1h1v2H6v1H5v1H4v1H3V5H2V4H1V3H0V1h1z'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="bg" aria-hidden="true"><div id="bg-deco"></div></div>

  <main id="app">
    <!-- 1. Opening gift -->
    <section id="scene-gift" class="scene active" aria-label="A mysterious present">
      <div id="main-wrap" class="gift-wrap">
        <button id="main-gift" class="bare" type="button" aria-label="Open your present"></button>
      </div>
    </section>

    <!-- 2. Birthday reveal -->
    <section id="scene-reveal" class="scene" aria-live="polite">
      <h1 id="greeting" class="greeting"></h1>
      <p id="reveal-skip" class="skip" hidden>TAP TO CONTINUE</p>
    </section>

    <!-- 3. Three presents -->
    <section id="scene-select" class="scene">
      <h2 id="select-title" class="select-title"></h2>
      <div id="present-row" class="present-row"></div>
    </section>

    <!-- 4. Opened present -->
    <section id="scene-present" class="scene">
      <div id="stage-scene" class="stage-scene"></div>
      <div id="stage-dialog" class="stage-dialog"></div>
    </section>
  </main>

  <div id="hud">
    <button id="btn-music" class="hud-btn" type="button" title="Music"></button>
    <button id="btn-mute" class="hud-btn" type="button" title="Sound"></button>
  </div>
  <button id="btn-back" class="hud-btn back-btn" type="button" aria-label="Back to presents"><span>BACK</span></button>

  <div id="flash" aria-hidden="true"></div>
  <canvas id="fx" aria-hidden="true"></canvas>
  <div id="cursor" aria-hidden="true"></div>

  <script src="js/config.js"></script>
  <script src="js/pixel.js"></script>
  <script src="js/art.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/fx.js"></script>
  <script src="js/cursor.js"></script>
  <script src="js/gift.js"></script>
  <script src="js/dialogue.js"></script>
  <script src="js/presents/camera.js"></script>
  <script src="js/presents/flowers.js"></script>
  <script src="js/presents/duck.js"></script>
  <script src="js/presents/book.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
